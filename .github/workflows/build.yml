name: Oasis Final Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🏗 Setup EAS
        run: npm install -g eas-cli

      - name: 📦 Match Credentials & Prep
        run: |
          set -e
          cd mobile
          
          # 1. تنظيف package.json وتصحيح التنسيق لتجنب خطأ EJSONPARSE
          node -e "let j=require('./package.json'); delete j.dependencies['react-native-startapp-ads']; require('fs').writeFileSync('./package.json', JSON.stringify(j, null, 2))"
          
          echo "legacy-peer-deps=true" > .npmrc
          npm install --legacy-peer-deps

          # 2. تشغيل ملف الإصلاح الخاص بك لـ ZegoCloud
          node patch-zegocloud.js

          # 3. ربط المشروع بالـ Project ID المرتبط بمفتاح SHA-256 الخاص بك
          echo '{"expo": {"name": "Oasis", "slug": "oasis-app", "version": "1.0.0", "android": {"package": "com.oasis.app2026", "compileSdkVersion": 34, "targetSdkVersion": 34}, "extra": {"eas": {"projectId": "742d678c-90bd-4cf1-b261-604691b3cf53"}}}}' > app.json
          
          # 4. تهيئة الأندرويد وحقن الـ Namespacecom.oasis.app2026
          npx expo prebuild --platform android --no-install
          find android -name "build.gradle" -exec sed -i '/android {/a \    namespace = "com.oasis.app2026"\n    compileSdk = 34\n    targetSdk = 34' {} + || true

      - name: 🚀 Build APK
        run: |
          cd mobile
          # إجبار النظام على استخدام التوقيع السحابي المرتبط بمفتاح SHA-256 الذي أرسلته
          EAS_NO_OTP=1 npx eas-cli project:init --non-interactive || true
          EAS_NO_OTP=1 npx eas-cli build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
