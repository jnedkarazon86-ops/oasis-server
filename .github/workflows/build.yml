name: Oasis Final Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🏗 Setup EAS
        run: npm install -g eas-cli

      - name: 📦 Match Credentials & Prep
        run: |
          set -e
          cd mobile
          
          # 1. حل خطأ EJSONPARSE: حذف مكتبة الإعلانات برمجياً دون كسر ملف JSON
          # نستخدم node للتأكد من حذف القيمة بشكل صحيح تقنياً
          node -e "let j=require('./package.json'); delete j.dependencies['react-native-startapp-ads']; require('fs').writeFileSync('./package.json', JSON.stringify(j, null, 2))"
          
          echo "legacy-peer-deps=true" > .npmrc
          
          # 2. تثبيت المكتبات الأساسية (تجاوز خطأ ETARGET)
          npm install --legacy-peer-deps

          # 3. تشغيل ملف الإصلاح الخاص بك لحل مشكلة ZegoCloud (typeof fix)
          node patch-zegocloud.js

          # 4. إنشاء app.json بالهوية الصحيحة com.oasis.app2026
          echo '{"expo": {"name": "Oasis", "slug": "oasis-app", "version": "1.0.0", "android": {"package": "com.oasis.app2026", "compileSdkVersion": 34, "targetSdkVersion": 34}, "extra": {"eas": {"projectId": "742d678c-90bd-4cf1-b261-604691b3cf53"}}}}' > app.json
          
          # 5. تهيئة بيئة أندرويد وتصحيح Gradle بناءً على هيكلية مشروعك
          npx expo prebuild --platform android --no-install
          find android -name "build.gradle" -exec sed -i '/android {/a \    namespace = "com.oasis.app2026"\n    compileSdk = 34\n    targetSdk = 34' {} + || true
          
          # 6. إصلاح مراجع Kotlin و ZegoCloud في node_modules
          find node_modules -name "*.gradle" -exec sed -i 's/extensions.extraProperties/project.ext/g' {} + || true
          find node_modules -name "AndroidManifest.xml" -exec sed -i 's/package="com.zegouikitrebuiltcallrn"/ /g' {} + || true

      - name: 🚀 Build APK
        run: |
          cd mobile
          EAS_NO_OTP=1 npx eas-cli build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
