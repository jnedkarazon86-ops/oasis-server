name: Oasis final Build
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # الخروج التلقائي إذا استمرت العملية أكثر من 40 دقيقة (لضمان عدم التعليق)
    timeout-minutes: 40
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Match Credentials & Prep
        run: |
          # أمر الخروج الفوري في حال فشل أي سطر برمجي
          set -e
          cd mobile
          
          echo "legacy-peer-deps=true" > .npmrc
          
          # 1. إنشاء eas.json (حل مشكلة التعليق وتثبيت القناة)
          echo '{"build": {"preview": {"android": {"buildType": "apk", "image": "latest"}, "channel": "preview"}}}' > eas.json

          # 2. إنشاء app.json (حل جذري لنقص compileSdkVersion)
          echo '{"expo": {"name": "Oasis", "slug": "oasis-app", "version": "1.0.0", "owner": "aboahj", "android": {"package": "com.aboahj.oasisapp", "compileSdkVersion": 34, "targetSdkVersion": 34, "buildToolsVersion": "34.0.0"}, "extra": {"eas": {"projectId": "742d678c-90bd-4cf1-b261-604691b3cf53"}}}}' > app.json
          
          npm pkg delete type
          npm install --legacy-peer-deps

          # 3. توليد ملفات الأندرويد (Prebuild) لضمان وجود المسارات
          npx expo prebuild --platform android --no-install

          # 4. تصحيح Gradle 8.3 (الحقن المتوافق مع سطر 16 في سجلاتك)
          find android -name "build.gradle" -exec sed -i '/android {/a \    namespace = "com.oasis.app"\n    compileSdk = 34\n    targetSdk = 34' {} + || true
          
          # 5. معالجة كافة مكتبات node_modules (لحل أخطاء Evaluating project)
          find node_modules -name "*.gradle" -exec sed -i '/android {/a \    namespace = "com.oasis.app"\n    compileSdk = 34' {} + || true

          # 6. تصحيح مراجع Kotlin و ZegoCloud
          find node_modules -name "*.gradle" -exec sed -i 's/extensions.extraProperties/project.ext/g' {} + || true
          find node_modules -name "*.kts" -exec sed -i 's/extensions.extraProperties/project.ext/g' {} + || true
          find node_modules -name "AndroidManifest.xml" -exec sed -i 's/package="com.zegouikitrebuiltcallrn"/ /g' {} + || true

      - name: 🚀 Build APK (Final Fix & Clear Cache)
        run: |
          cd mobile
          # التنظيف والتشغيل غير التفاعلي لضمان الخروج بنتيجة (نجاح أو فشل صريح)
          npx eas-cli build --platform android --profile preview --non-interactive --clear-cache
